<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day 13 AI Observability Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #09111f;
        --panel: #101d30;
        --panel-soft: #14243a;
        --border: #263b59;
        --text: #e8f0ff;
        --muted: #9db0cc;
        --good: #37d39a;
        --warn: #f6bd4a;
        --bad: #ff7183;
        --blue: #6ba8ff;
        --purple: #b293ff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        background: radial-gradient(circle at top right, #152e4e 0, var(--page) 42%);
        color: var(--text);
        font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 1720px; margin: 0 auto; padding: 14px 16px 20px; }
      header { display: flex; justify-content: space-between; gap: 18px; align-items: start; margin-bottom: 12px; }
      h1 { font-size: clamp(20px, 2.2vw, 28px); margin: 0 0 3px; }
      h2 { font-size: 12px; margin: 0; }
      p { margin: 0; color: var(--muted); }
      .meta, .badge { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 999px; padding: 7px 11px; color: var(--muted); white-space: nowrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 12px var(--good); }
      .grid { display: grid; grid-template-columns: repeat(6, minmax(185px, 1fr)); gap: 9px; overflow-x: auto; padding-bottom: 4px; }
      .panel { min-height: 188px; background: linear-gradient(145deg, var(--panel), var(--panel-soft)); border: 1px solid var(--border); border-radius: 11px; padding: 10px; box-shadow: 0 12px 30px #00000024; }
      .panel-top { display: block; margin-bottom: 7px; }
      .threshold { display: inline-block; margin-top: 4px; border-radius: 5px; padding: 2px 5px; font-size: 9px; background: #ffffff0b; color: var(--muted); }
      .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; margin-bottom: 7px; }
      .metric { background: #07101d77; border: 1px solid #ffffff0e; border-radius: 7px; padding: 5px; }
      .metric .label { color: var(--muted); display: block; font-size: 9px; }
      .metric .value { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.4px; margin-top: 1px; }
      .metric .value.good { color: var(--good); }
      .metric .value.warn { color: var(--warn); }
      .metric .value.bad { color: var(--bad); }
      canvas { width: 100%; height: 56px; display: block; background: #07101d66; border-radius: 6px; }
      .empty { height: 56px; display: grid; place-items: center; color: var(--muted); background: #07101d66; border-radius: 6px; }
      .breakdown { display: grid; gap: 4px; padding-top: 0; }
      .breakdown-row { display: grid; grid-template-columns: 64px 1fr 18px; align-items: center; gap: 4px; color: var(--muted); font-size: 9px; }
      .bar { height: 6px; overflow: hidden; border-radius: 999px; background: #07101d; }
      .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--bad); }
      .notice { margin-bottom: 10px; padding: 9px 11px; border-radius: 10px; background: #f6bd4a18; border: 1px solid #f6bd4a44; color: #ffe1a0; }
      footer { color: var(--muted); font-size: 11px; margin-top: 10px; }
      @media (max-width: 820px) { main { padding: 16px 12px; } header { flex-direction: column; } }
      @media (max-width: 480px) { .metrics { grid-template-columns: 1fr 1fr; } .breakdown-row { grid-template-columns: 90px 1fr 30px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Day 13 — AI Observability</h1>
          <p>Source: <code>data/logs.jsonl</code> · Cửa sổ quan sát: 60 phút</p>
        </div>
        <div class="meta"><span class="dot"></span><span id="refresh-status">Tự refresh mỗi 30 giây</span></div>
      </header>

      <div id="notice" class="notice" hidden></div>
      <section class="grid" id="dashboard"></section>
      <footer id="last-updated">Đang tải dữ liệu…</footer>
    </main>

    <script>
      const LOG_URL = "data/logs.jsonl";
      const WINDOW_MINUTES = 60;
      const REFRESH_MS = 30_000;

      const number = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
      const decimal = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      function escapeHtml(value) {
        return String(value).replace(/[&<>"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char]);
      }

      function percentile(values, pct) {
        if (!values.length) return 0;
        const sorted = [...values].sort((a, b) => a - b);
        const index = Math.max(0, Math.min(sorted.length - 1, Math.ceil(sorted.length * pct) - 1));
        return sorted[index];
      }

      function sum(records, field) {
        return records.reduce((total, record) => total + (Number(record[field]) || 0), 0);
      }

      function mean(records, field) {
        return records.length ? sum(records, field) / records.length : 0;
      }

      function byMinute(records, field, aggregation = "sum") {
        const map = new Map();
        records.forEach(record => {
          const minute = new Date(record.ts);
          minute.setSeconds(0, 0);
          const key = minute.toISOString();
          const current = map.get(key) || { total: 0, count: 0 };
          current.total += field ? (Number(record[field]) || 0) : 1;
          current.count += 1;
          map.set(key, current);
        });
        return [...map.entries()]
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([label, stats]) => ({
            label,
            value: aggregation === "mean" ? stats.total / stats.count : stats.total,
          }));
      }

      function metric(label, value, state = "") {
        return `<div class="metric"><span class="label">${escapeHtml(label)}</span><span class="value ${state}">${escapeHtml(value)}</span></div>`;
      }

      function panel(title, threshold, content, chartId) {
        return `<article class="panel"><div class="panel-top"><h2>${title}</h2><span class="threshold">${threshold}</span></div>${content}${chartId ? `<canvas id="${chartId}"></canvas>` : ""}</article>`;
      }

      function drawLine(canvas, points, color, threshold) {
        if (!canvas || !points.length) return;
        const ratio = window.devicePixelRatio || 1;
        const width = canvas.clientWidth * ratio;
        const height = canvas.clientHeight * ratio;
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        context.scale(ratio, ratio);
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        const padding = { top: 12, right: 12, bottom: 20, left: 42 };
        const maximum = Math.max(...points.map(point => point.value), threshold || 0, 1) * 1.1;

        context.clearRect(0, 0, w, h);
        context.strokeStyle = "#ffffff16";
        context.lineWidth = 1;
        for (let row = 0; row <= 3; row += 1) {
          const y = padding.top + ((h - padding.top - padding.bottom) * row / 3);
          context.beginPath(); context.moveTo(padding.left, y); context.lineTo(w - padding.right, y); context.stroke();
        }
        if (threshold) {
          const y = h - padding.bottom - ((threshold / maximum) * (h - padding.top - padding.bottom));
          context.setLineDash([4, 4]); context.strokeStyle = "#f6bd4a";
          context.beginPath(); context.moveTo(padding.left, y); context.lineTo(w - padding.right, y); context.stroke();
          context.setLineDash([]);
        }
        context.strokeStyle = color;
        context.lineWidth = 2;
        context.beginPath();
        points.forEach((point, index) => {
          const x = padding.left + (points.length === 1 ? (w - padding.left - padding.right) / 2 : index * (w - padding.left - padding.right) / (points.length - 1));
          const y = h - padding.bottom - ((point.value / maximum) * (h - padding.top - padding.bottom));
          if (index === 0) context.moveTo(x, y); else context.lineTo(x, y);
        });
        context.stroke();
        context.fillStyle = "#9db0cc";
        context.font = "11px system-ui";
        context.fillText(maximum.toFixed(maximum < 10 ? 2 : 0), 2, padding.top + 4);
        context.fillText("0", 24, h - padding.bottom + 4);
      }

      function drawCharts(data) {
        drawLine(document.getElementById("latency-chart"), data.latency, "#6ba8ff", 3000);
        drawLine(document.getElementById("traffic-chart"), data.traffic, "#37d39a", 1);
        drawLine(document.getElementById("cost-chart"), data.cost, "#b293ff", 2.5);
        drawLine(document.getElementById("quality-chart"), data.quality, "#37d39a", 0.75);
      }

      function render(records) {
        const cutoff = Date.now() - WINDOW_MINUTES * 60 * 1000;
        const recent = records.filter(record => new Date(record.ts).getTime() >= cutoff);
        const requests = recent.filter(record => record.event === "request_received");
        const responses = recent.filter(record => record.event === "response_sent");
        const failures = recent.filter(record => record.event === "request_failed");
        const latency = responses.map(record => Number(record.latency_ms) || 0);
        const errorRate = requests.length ? failures.length / requests.length * 100 : 0;
        const breakdown = failures.reduce((all, record) => {
          const key = record.error_type || "Unknown";
          all[key] = (all[key] || 0) + 1;
          return all;
        }, {});
        const breakdownMax = Math.max(...Object.values(breakdown), 1);
        const totalCost = sum(responses, "cost_usd");
        const totalTokensIn = sum(responses, "tokens_in");
        const totalTokensOut = sum(responses, "tokens_out");
        const averageQuality = mean(responses, "quality_score");
        const latestMinuteTraffic = byMinute(requests).at(-1)?.value || 0;
        const dashboard = document.getElementById("dashboard");

        dashboard.innerHTML = [
          panel("1. Latency percentiles", "P95 ≤ 3000 ms", `<div class="metrics">${metric("P50", `${number.format(percentile(latency, .50))} ms`)}${metric("P95", `${number.format(percentile(latency, .95))} ms`, percentile(latency, .95) > 3000 ? "bad" : "good")}${metric("P99", `${number.format(percentile(latency, .99))} ms`)}</div>`, "latency-chart"),
          panel("2. Request traffic", "≥ 1 request/phút", `<div class="metrics">${metric("Tổng request", number.format(requests.length))}${metric("Request/phút gần nhất", number.format(latestMinuteTraffic), latestMinuteTraffic >= 1 ? "good" : "warn")}</div>`, "traffic-chart"),
          panel("3. Error rate & breakdown", "Error rate ≤ 2%", `<div class="metrics">${metric("Error rate", `${decimal.format(errorRate)}%`, errorRate > 2 ? "bad" : "good")}${metric("Request lỗi", number.format(failures.length))}${metric("Request tổng", number.format(requests.length))}</div><div class="breakdown">${Object.keys(breakdown).length ? Object.entries(breakdown).map(([type, count]) => `<div class="breakdown-row"><span>${escapeHtml(type)}</span><div class="bar"><i style="width:${count / breakdownMax * 100}%"></i></div><b>${count}</b></div>`).join("") : '<p>Chưa có request lỗi.</p>'}</div>`, null),
          panel("4. Cost over time", "Tổng cost ≤ $2.50", `<div class="metrics">${metric("Tổng cost", `$${totalCost.toFixed(4)}`, totalCost > 2.5 ? "bad" : "good")}${metric("Cost / response", `$${(responses.length ? totalCost / responses.length : 0).toFixed(4)}`)}</div>`, "cost-chart"),
          panel("5. Input & output tokens", "Tổng mỗi field ≤ 50,000", `<div class="metrics">${metric("Input tokens", number.format(totalTokensIn))}${metric("Output tokens", number.format(totalTokensOut))}${metric("Tổng tokens", number.format(totalTokensIn + totalTokensOut))}</div>`, null),
          panel("6. Quality proxy", "Mean quality ≥ 0.75", `<div class="metrics">${metric("Mean quality", decimal.format(averageQuality), averageQuality < .75 ? "bad" : "good")}${metric("Responses", number.format(responses.length))}</div>`, "quality-chart"),
        ].join("");

        const notice = document.getElementById("notice");
        notice.hidden = recent.length > 0;
        notice.textContent = "Không có log trong 60 phút gần nhất. Hãy chạy API và load test rồi refresh lại trang.";
        drawCharts({
          latency: byMinute(responses, "latency_ms", "mean"),
          traffic: byMinute(requests),
          cost: byMinute(responses, "cost_usd"),
          quality: byMinute(responses, "quality_score", "mean"),
        });
        document.getElementById("last-updated").textContent = `Cập nhật lần cuối: ${new Date().toLocaleString("vi-VN")} · ${recent.length} log records trong 60 phút`;
      }

      async function refresh() {
        try {
          const response = await fetch(`${LOG_URL}?t=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = await response.text();
          const records = text.split("\n").filter(Boolean).map(line => JSON.parse(line));
          render(records);
          document.getElementById("refresh-status").textContent = "Tự refresh mỗi 30 giây";
        } catch (error) {
          document.getElementById("notice").hidden = false;
          document.getElementById("notice").textContent = `Không đọc được ${LOG_URL}: ${error.message}`;
          document.getElementById("refresh-status").textContent = "Không thể tải log";
        }
      }

      window.addEventListener("resize", refresh);
      refresh();
      setInterval(refresh, REFRESH_MS);
    </script>
  </body>
</html>
