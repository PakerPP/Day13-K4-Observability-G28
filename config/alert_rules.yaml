alerts:
  - name: HighLatencyP95
    severity: critical
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: SRE-on-call (Thanh vien D)
    runbook: docs/alerts.md#alert-1

  - name: ElevatedErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: API-on-call (Thanh vien A)
    runbook: docs/alerts.md#alert-2

  - name: QualityScoreDegraded
    severity: warning
    condition: quality_score_avg < 0.75 for 15m
    type: symptom-based
    owner: SRE-on-call (Thanh vien D)
    runbook: docs/alerts.md#alert-3
